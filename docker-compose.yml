services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: governance
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance-local-only
    volumes:
      - governance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://governance:governance-local-only@postgres:5432/governance
      JWT_SECRET: docker-local-secret-change-before-shared-use
      GRAPH_PROVIDER: local
      AI_PROVIDER: mock
      PERSISTENCE_MODE: database
      RAG_MODE: postgres
      EMBEDDING_PROVIDER: hash
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  governance-postgres:
